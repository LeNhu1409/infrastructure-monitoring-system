name: infrastructure-monitoring-system

# Lab giám sát: Prometheus + Grafana + Alertmanager + Node Exporter + cAdvisor + Blackbox.
# Chạy: cp .env.example .env && docker compose up -d

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hkdn-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hkdn-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: hkdn-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Hay tao file .env tu .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Metric của máy chủ (CPU, RAM, disk, network, uptime).
  # Lưu ý: network_mode bridge nên metric network là của container; muốn đo card mạng
  # thật của host trên Linux, đổi sang network_mode: host và sửa target trong prometheus.yml.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: hkdn-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro
      - ./scenarios/textfile:/textfile:ro
    expose:
      - "9100"
    restart: unless-stopped

  # Metric của từng container.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hkdn-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Kiểm tra endpoint (HTTP) của dịch vụ.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hkdn-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    restart: unless-stopped

  # Dịch vụ mẫu bị giám sát; kịch bản "service down" sẽ dừng container này.
  demo-web:
    image: nginx:1.27-alpine
    container_name: hkdn-demo-web
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
