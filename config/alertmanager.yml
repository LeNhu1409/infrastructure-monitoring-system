route:
  receiver: default
  group_by: [alertname, instance, mountpoint]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  # Receiver mặc định: hiển thị cảnh báo trên giao diện Alertmanager.
  # http://localhost:9093
  # Muốn nhận email/webhook: cấu hình thêm tại đây.
  # Không ghi mật khẩu hoặc token thật vào file này.
  - name: default

inhibit_rules:
  # Khi có Critical thì ức chế Warning cùng loại,
  # cùng VM và cùng mountpoint (nếu có).
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance, mountpoint]
