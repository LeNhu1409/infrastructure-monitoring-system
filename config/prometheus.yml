global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: lab-host-1

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Kiểm tra endpoint HTTP qua Blackbox Exporter.
  # Thêm dịch vụ mới: thêm URL vào targets và gắn nhãn service.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://demo-web:80"]
        labels:
          service: demo-web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: vm-web
    static_configs:
      - targets: ["192.168.56.11:9100"]
        labels:
          host: vm-web
          role: web

  # Thu thập metric hệ thống từ máy chủ vm-db.
  - job_name: vm-db-node
    static_configs:
      - targets: ["192.168.56.12:9100"]
        labels:
          host: vm-db
          role: database

  # Thu thập metric Redis thông qua Redis Exporter.
  - job_name: redis
    static_configs:
      - targets: ["192.168.56.12:9121"]
        labels:
          host: vm-db
          service: redis

  # Thu thập metric hệ thống từ máy chủ vm-app.
  - job_name: vm-app
    static_configs:
      - targets: ["192.168.56.13:9100"]
        labels:
          host: vm-app
          role: application
