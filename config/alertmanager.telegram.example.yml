# FILE MẪU - chưa được nạp vào hệ thống (docker-compose không mount file này).
# Cách dùng: xem docs/telegram-notification.md
# KHÔNG ghi token thật vào file này. Token đặt trong secrets/telegram_token (đã bị .gitignore).
route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_token
        chat_id: -1001234567890        # thay bằng chat_id nhóm test của nhóm (số nguyên)
        parse_mode: HTML
        send_resolved: true            # gửi cả thông báo khi sự cố được khắc phục
        message: |-
          {{ if eq .Status "firing" }}🔥 <b>CẢNH BÁO</b>{{ else }}✅ <b>ĐÃ KHẮC PHỤC</b>{{ end }}
          {{ range .Alerts }}<b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
          Host: {{ .Labels.instance }}
          {{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
