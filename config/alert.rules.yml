groups:
  # Luật không cần đặt ngưỡng (chỉ xét sống/chết) nên bật sẵn.
  - name: hkdn-availability
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mất kết nối metric của {{ $labels.instance }}"
          description: "Prometheus không scrape được {{ $labels.instance }} trong hơn 1 phút."

      - alert: ServiceDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Dịch vụ {{ $labels.service }} không phản hồi"
          description: "Kiểm tra HTTP tới {{ $labels.instance }} thất bại trong hơn 30 giây."

